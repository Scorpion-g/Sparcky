services:
  # Base de données MongoDB
  mongo:
    image: mongo:7-jammy
    container_name: sparcky_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=sparcky
    networks:
      - sparcky_net

  # Bot Discord
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: sparcky_bot
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - PORT=3000
    networks:
      - sparcky_net

  # API Express du Panel
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sparcky_api
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - sparcky_net

  # Uptime Kuma (Surveillance & Status Page)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime_kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - sparcky_net

  # Vaultwarden (Gestionnaire de mots de passe Bitwarden)
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - DOMAIN=https://vault.matteoriviere.fr
    volumes:
      - vaultwarden_data:/data
    networks:
      - sparcky_net

  # Panel Web (React 19 servi par Nginx avec proxy inverse vers l'API, Uptime Kuma et Vaultwarden)
  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    container_name: sparcky_panel
    restart: unless-stopped
    depends_on:
      - api
      - uptime-kuma
      - vaultwarden
    ports:
      - "80:80"
      - "443:443"
    networks:
      - sparcky_net

volumes:
  mongo_data:
  uptime_kuma_data:
  vaultwarden_data:

networks:
  sparcky_net:
    driver: bridge
