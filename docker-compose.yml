services:
  # Base de données MongoDB
  mongo:
    image: mongo:7-jammy
    container_name: sparcky_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=sparcky
    networks:
      - sparcky_net

  # Bot Discord
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: sparcky_bot
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - PORT=3000
    networks:
      - sparcky_net

  # API Express du Panel
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sparcky_api
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - sparcky_net

  # Uptime Kuma (Surveillance & Status Page v2)
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime_kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - sparcky_net

  # Vaultwarden (Gestionnaire de mots de passe Bitwarden)
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - DOMAIN=https://vault.matteoriviere.fr
    volumes:
      - vaultwarden_data:/data
    networks:
      - sparcky_net

  # Dozzle (Visualiseur de logs Docker en temps réel)
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
    networks:
      - sparcky_net

  # WG-Easy (Serveur VPN WireGuard + Interface Web)
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg_easy
    restart: unless-stopped
    environment:
      - WG_HOST=45.147.96.24
      - PASSWORD_HASH=$$2a$$12$$3Ul8.aneYrI0yfdm0AX6PuPghQerY7z9629XXQrUZOmMTnDcs3zue
      - WG_PORT=51820
      - WG_DEFAULT_DNS=1.1.1.1,1.0.0.1
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
    volumes:
      - wg_data:/etc/wireguard
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      - sparcky_net

  # Panel Web (React 19 servi par Nginx avec proxy inverse vers l'API, Uptime Kuma, Vaultwarden, Dozzle et VPN)
  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    container_name: sparcky_panel
    restart: unless-stopped
    depends_on:
      - api
      - uptime-kuma
      - vaultwarden
      - dozzle
      - wg-easy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - sparcky_net

volumes:
  mongo_data:
  uptime_kuma_data:
  vaultwarden_data:
  dozzle_data:
  wg_data:

networks:
  sparcky_net:
    driver: bridge
