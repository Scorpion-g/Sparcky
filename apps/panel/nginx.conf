server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    # Résolveur DNS interne Docker pour éviter la mise en cache d'IP obsolète
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3001;

    ssl_certificate /etc/nginx/ssl/sparcky.crt;
    ssl_certificate_key /etc/nginx/ssl/sparcky.key;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy pour l'API Express
    location /api {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy pour l'authentification Discord OAuth2
    location /auth {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Fallback pour React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
